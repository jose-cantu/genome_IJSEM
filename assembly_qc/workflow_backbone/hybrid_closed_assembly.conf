// -------- I/O parameters --------
params.index         = "/mount/britton/Jose/Jobs/Jason/2025-09-22-novel-isolate-closed-genome-trycycler-IJSEM-Criteria-Updates-nextflow-run/workflow/nextflow_readfile.csv"
params.outdir        = "/mount/britton/Jose/Jobs/Jason/2025-09-22-novel-isolate-closed-genome-trycycler-IJSEM-Criteria-Updates-nextflow-run/workflow-output"

// Tool DBs used by this workflow
params.busco_lineage = "/mount/britton/Jose/DBs/busco/lineages/bacteria_odb10"
params.bakta_db      = "/mount/britton/leap/dbs/bakta/db"
params.gtdbtk_db     = "/mount/britton/leap/dbs/gtdbtk"
params.checkm1_db    = "/mount/britton/kyle/DBs/MY_CHECKM_FOLDER"
params.plassembler_db = "/mount/britton/Jose/DBs/plassembler_db" 

// Used in Autocycler 
params.autocycler_threads = 16      // threads per assembly job (Flye max is 128)
params.autocycler_jobs    = 4       // number of assemblies to run in parallel
params.autocycler_readtype = 'ont_r10'  // or ont_r9, pacbio_clr, pacbio_hifi
params.autocycler_mindepth = 0.1    // relative depth filter for contigs
params.autocycler_timeout  = '8h'   // maximum time per assembly job

// For Medaka, dnaapler and fastani 
params.medaka_probe = false 
params.medaka_model = 'r104_e81_sup_g610'
params.dnaapler_genes = 'dnaA,repA'
params.fastani_required = false   // set true to force a hard error when refs are missing

// For automatic FastANI panel construction
params.fastani_max_refs   = 20      // number of neighbour genomes to include
params.fastani_prefer_type = true   // prefer type-material assemblies when available


profiles {
  standard {
    process.executor = 'local'
  }

  MAB {
    executor {
      name            = 'slurm'
      queueSize       = 100
      submitRateLimit = '50/1min'
      exitReadTimeout = '3600 sec'
      killBatchSize   = 10
      retry.delay     = '5 sec'
    }

    // Make tools see their DBs without exporting inside scripts
    env.CHECKM_DATA_PATH = params.checkm1_db
    env.GTDBTK_DATA_PATH = params.gtdbtk_db

    process {
      executor      = 'slurm'
      scratch       = true
      maxRetries    = 3
      errorStrategy = 'terminate'

      withName: FASTP                     { cpus = 8;  time = '1h';  memory = '8 GB'  }
      withName: PORECHOP_ABI              { cpus = 8;  time = '2h';  memory = '8 GB'  }
      withName: NANOPLOT                  { cpus = 2;  time = '2h';  memory = '4 GB'  }
      withName: AUTOCYCLER                { cpus = 16
                                            time = '48h' 
					    memory = '64 GB'
                                            maxForks = 1
					    env {
      					    PATH="/mount/britton/Jose/DBs/github_repos_with_commit_updates_ahead_of_conda_package_tool/Autocycler/src:$PATH"
					    PYTHONPATH="/mount/britton/Jose/DBs/github_repos_with_commit_updates_ahead_of_conda_package_tool/Autocycler/src:$PYTHONPATH" 
                                            PLASSEMBLER_DB = params.plassembler_db }} 
      withName: DNAAPLER_ROTATE           { cpus = 16; time = '2h';  memory = '32 GB' } 
      withName: COV_PRIMARY               { cpus = 16; time = '1h';  memory = '16 GB' }
      withName: POLYPOLISH_CAREFUL_ONLY   { cpus = 16; time = '1.5h'; memory = '16 GB' }
      withName: POLY_CAREFUL_PLUS_PYPOLCA { cpus = 12; time = '3h';  memory = '24 GB' }
      withName: POLY_DEFAULT_PLUS_PYPOLCA { cpus = 16; time = '3h';  memory = '24 GB' }
      withName: QUAST                     { cpus = 8;  time = '1h';  memory = '8 GB'  }
      withName: CHECKM1                   { cpus = 8;  time = '2h';  memory = '64 GB'; scratch = false }
      withName: BUSCO                     { cpus = 8;  time = '2h';  memory = '32 GB' }
      withName: YAK                       { cpus = 8;  time = '1.5h'; memory = '8 GB'  }
      withName: BAKTA                     { cpus = 8;  time = '2h';  memory = '16 GB' }
      withName: BARRNAP_16S               { cpus = 4;  time = '1h';   memory = '4 GB'  }
      withName: BUILD_FASTANI_PANEL       { cpus = 4;  time = '4h'; memory = '8 GB' }
      withName: FASTANI_BATCH             { cpus = 8;  time = '2h';   memory = '8 GB'  }
      withName: TYGS_EXPORT               { cpus = 1;  time = '30m';  memory = '1 GB'  }
      withName: MEDAKA_PROBE              { cpus = 16; time = '6h';   memory = '32 GB' }
      withName: YAK_AB_TEST               { cpus = 8;  time = '1h';   memory = '8 GB'  }
      withName: GTDBTK                    { cpus = 8;  time = '2h';  memory = '64 GB' }
      withName: GTDB_CLASSIFY_TREE        { cpus = 8;  time = '4h';  memory = '64 GB' } 
      withName: GTDB_DENOVO_ALIGN         { cpus = 8;  time = '24h';  memory = '64 GB' } 
      withName: IQTREE2                   { cpus = 8;  time = '8h';  memory = '64 GB' }
      withName: ITOL                      { cpus = 8;  time = '2h';  memory = '32 GB' } 
      withName: BANDAGE_IMG               { cpus = 2;  time = '2h';  memory = '4 GB'  }
      withName: MULTIQC                   { cpus = 2;  time = '1h';  memory = '4 GB'  }
    }
  }
}

